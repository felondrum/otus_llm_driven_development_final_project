[pytest]
testpaths = tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
pythonpath = src
markers =
    asyncio: mark test as async
    e2e: end-to-end tests (requires all services)
    integration: integration tests
    unit: unit tests
