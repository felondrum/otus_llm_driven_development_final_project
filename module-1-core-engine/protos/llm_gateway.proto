syntax = "proto3";

package chameleon.core.v1;

import "google/protobuf/empty.proto";
import "common.proto";

service LLMGatewayService {
    rpc Generate(GenerateRequest) returns (GenerateResponse);
    rpc StreamGenerate(GenerateRequest) returns (stream GenerateResponse);
    rpc GetModelStatus(google.protobuf.Empty) returns (ModelStatusResponse);
    rpc HealthCheck(google.protobuf.Empty) returns (HealthStatus);
}

message GenerateRequest {
    string prompt = 1;
    ModelComplexity complexity = 2;
    GenerationConfig config = 3;
}

enum ModelComplexity {
    COMPLEXITY_UNSPECIFIED = 0;
    FAST = 1;
    BALANCED = 2;
    POWERFUL = 3;
}

message GenerationConfig {
    float temperature = 1;
    int32 max_tokens = 2;
    bool stream = 3;
    repeated string stop_sequences = 4;
}

message GenerateResponse {
    string text = 1;
    string model_used = 2;
    ModelComplexity complexity_used = 3;
    TokenUsage token_usage = 4;
    int64 latency_ms = 5;
    bool from_cache = 6;
}

message TokenUsage {
    int32 prompt_tokens = 1;
    int32 completion_tokens = 2;
    int32 total_tokens = 3;
}

message ModelStatusResponse {
    map<string, string> models = 1;
    string default_model = 2;
}

