server:
  port: 8001
  host: 0.0.0.0
  debug: false

services:
  redis:
    host: redis
    port: 6379
    db: 0
    socket_timeout: 5
  qdrant:
    host: qdrant
    port: 6333
    grpc_port: 6334
    timeout: 10
  ollama:
    host: ollama
    port: 11434
    timeout: 30
  langfuse:
    host: http://langfuse:5000
    enabled: true

logging:
  level: INFO
  format: json

cache:
  default_ttl: 3600
  max_size: 100000

retries:
  max_attempts: 3
  initial_backoff_ms: 100
  max_backoff_ms: 10000
  backoff_multiplier: 2.0

fallback:
  chain:
    - ollama:qwen2.5:1.5b
    - yandex:ya-llm
  return_original_on_fallback: true
