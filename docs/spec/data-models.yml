# spec/data-models.yml
schema: 1.0.0
type: data_models

entities:
  - name: Message
    description: "Сообщение в чате"
    fields:
      - name: message_id
        type: string
        format: uuid
        required: true
        description: "Уникальный идентификатор"
      - name: sender_id
        type: string
        required: true
        description: "ID отправителя"
      - name: recipient_id
        type: string
        required: false
        description: "ID получателя (null для комнаты)"
      - name: room_id
        type: string
        required: false
        description: "ID комнаты (null для direct)"
      - name: original_text
        type: string
        max_length: 4000
        required: true
        description: "Исходный текст"
      - name: adapted_text
        type: string
        max_length: 4000
        required: false
        description: "Адаптированный текст"
      - name: was_adapted
        type: boolean
        default: false
      - name: style_used
        type: string
        enum: [chekhov, dovlatov, pelevin, ilfpetrov]
        required: false
      - name: timestamp
        type: datetime
        required: true
    relations:
      - sender -> UserProfile
      - recipient -> UserProfile

  - name: UserProfile
    description: "Профиль пользователя"
    fields:
      - name: user_id
        type: string
        required: true
        description: "Уникальный ID пользователя"
      - name: full_name
        type: string
        required: true
      - name: role
        type: string
        enum: [employee, team_lead, manager, director, hr, intern]
        default: employee
      - name: department
        type: string
        required: false
      - name: honorific_type
        type: string
        enum: [first_name, first_last, patronymic, title_last]
        default: first_name
      - name: communication_mode
        type: string
        enum: [formal, informal, technical, diplomatic]
        default: informal
      - name: known_triggers
        type: array
        items: string
        default: []
      - name: adaptive_history_vector
        type: array
        items: float
        size: 768
        required: false
      - name: last_updated
        type: datetime
    indexes:
      - user_id (primary, exact lookup)
      - role (filter)
      - department (filter)

  - name: CorporateRule
    description: "Корпоративное правило коммуникации"
    fields:
      - name: rule_id
        type: string
        format: uuid
        required: true
      - name: category
        type: string
        enum: [address, tone, content, timing]
      - name: priority
        type: integer
        min: 1
        max: 10
        default: 5
      - name: condition
        type: string
        description: "Условие применения (role_from, role_to, keywords)"
      - name: transformation
        type: string
        description: "Что и как менять"
      - name: transformation_prompt
        type: string
        description: "Промпт для LLM"
      - name: example_original
        type: string
      - name: example_adapted
        type: string
      - name: role_from
        type: array
        items: string
      - name: role_to
        type: array
        items: string
    indexes:
      - role_from, role_to (filter)
      - category (filter)
    embedding:
      field: transformation_prompt
      model: nomic-embed-text
      dimensions: 768

  - name: ArtisticStyle
    description: "Литературный стиль для адаптации"
    fields:
      - name: style_id
        type: string
        format: uuid
      - name: style_name
        type: string
        enum: [chekhov, dovlatov, pelevin, ilfpetrov]
        unique: true
      - name: author
        type: string
      - name: sample_text
        type: string
        max_length: 1000
        description: "Отрывок из произведения"
      - name: emotion_tags
        type: array
        items: string
      - name: era
        type: string
    indexes:
      - style_name (exact)
      - author (filter)
    embedding:
      field: sample_text
      model: nomic-embed-text
      dimensions: 768

  - name: AnalyticsEvent
    description: "Событие аналитики"
    fields:
      - name: event_id
        type: string
        format: uuid
      - name: message_id
        type: string
      - name: original_toxicity_score
        type: float
        min: 0
        max: 1
      - name: original_formality_score
        type: integer
        min: 1
        max: 10
      - name: adaptation_effectiveness
        type: float
        min: 0
        max: 1
      - name: predicted_conflict_without
        type: float
        min: 0
        max: 1
      - name: predicted_conflict_with
        type: float
        min: 0
        max: 1
      - name: actual_outcome
        type: string
        enum: [positive, neutral, negative]
        required: false
      - name: processed_at
        type: datetime
    retention_days: 90