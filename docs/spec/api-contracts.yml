# spec/api-contracts.yml
schema: 1.0.0
type: api_contracts

contracts:
  - name: orchestrator_grpc
    proto_file: contracts/proto/orchestrator.proto
    version: v1
    services:
      - name: OrchestratorService
        methods:
          - name: ProcessMessage
            request:
              message_id: string
              sender_id: string
              recipient_id: string
              room_id: string
              text: string (1-4000 chars)
              style_name: string (optional)
            response:
              adapted_text: string
              was_adapted: boolean
              confidence: float
              model_used: string
              processing_time_ms: integer
            errors:
              - INVALID_ARGUMENT (3)
              - NOT_FOUND (5)
              - DEADLINE_EXCEEDED (4)
              - RESOURCE_EXHAUSTED (8)
              - INTERNAL (13)

          - name: HealthCheck
            request: {}
            response:
              status: string
              version: string
              uptime_seconds: integer

  - name: chat_websocket
    protocol: ws
    endpoint: /ws
    messages:
      - name: auth
        direction: c2s
        schema:
          type: "auth"
          user_id: string
          token: string
      - name: auth_ok
        direction: s2c
        schema:
          type: "auth_ok"
          session_id: string
      - name: message_send
        direction: c2s
        schema:
          type: "message"
          id: string
          to: string
          text: string
          style: string (optional)
      - name: message_recv
        direction: s2c
        schema:
          type: "message"
          id: string
          from: string
          text: string
          was_adapted: boolean
          original_text: string (conditional)
          adaptation_metadata: object (optional)

  - name: admin_rest
    base_path: /api/v1/admin
    auth: X-API-Key
    endpoints:
      - path: /documents/upload
        method: POST
        content_type: multipart/form-data
        parameters:
          - name: file
            type: file
            required: true
          - name: collection
            type: string
            enum: [corporate_rules, artistic_styles]
            required: true
        responses:
          202: JobStatus
          400: ErrorResponse
          401: ErrorResponse

      - path: /profiles/import
        method: POST
        content_type: multipart/form-data
        parameters:
          - name: file
            type: file
            required: true
            formats: [text/csv, application/json]
        responses:
          200: ImportResult
          400: ErrorResponse

  - name: async_events
    type: redis_stream
    stream: chameleon:messages:processed
    consumer_group: blackbox_group
    schema:
      event_id: string
      event_version: string
      event_type: "message.processed"
      timestamp: datetime
      correlation_id: string
      source: "orchestrator"
      data:
        original:
          message_id: string
          sender_id: string
          recipient_id: string
          text: string
          timestamp: datetime
        adapted:
          text: string
          was_adapted: boolean
          model_used: string
          processing_time_ms: integer
        metadata:
          rules_applied: array
          style_used: string (optional)
          cache_hit: boolean
          fallback_used: boolean