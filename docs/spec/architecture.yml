# spec/architecture.yml
schema: 1.0.0
type: system_architecture

modules:
  - id: module-1-core-engine
    name: "Core Engine"
    responsibility: "Адаптация текста через LLM, RAG поиск"
    language: "Python 3.11"
    package_manager: poetry
    port: 8001 (gRPC)
    dependencies:
      - qdrant
      - ollama
      - redis
    interfaces:
      - type: gRPC
        service: OrchestratorService
        methods:
          - ProcessMessage
          - HealthCheck
      - type: gRPC
        service: RetrieverService
        methods:
          - GetProfile
          - GetRules
          - GetStyleExamples
      - type: HTTP
        service: LLMGatewayService
        port: 8003
        methods:
          - POST /generate
          - GET /health

  - id: module-2-chat-frontend
    name: "Chat Frontend"
    responsibility: "Веб-чат, WebSocket соединения"
    language: "Node.js 20 + React 18"
    port: 8080 (HTTP), 8081 (WS)
    dependencies:
      - module-1-core-engine
    interfaces:
      - type: WebSocket
        endpoint: /ws
        messages:
          - auth
          - message
          - typing
      - type: REST
        endpoints:
          - GET /api/users
          - GET /api/rooms
          - GET /api/messages

  - id: module-3-admin-data
    name: "Admin & Data Management"
    responsibility: "Управление RAG данными, профилями"
    language: "Python 3.11 + React 18"
    port: 8100
    dependencies:
      - qdrant
      - postgres
    interfaces:
      - type: REST
        endpoints:
          - POST /api/documents/upload
          - GET /api/documents
          - DELETE /api/documents/{id}
          - POST /api/profiles/import
          - PUT /api/profiles/{id}
          - GET /api/system/status

  - id: module-4-analytics
    name: "Analytics & Dashboard"
    responsibility: "Анализ оригиналов, дашборд, RAGas eval"
    language: "Python 3.11"
    port: 8200
    dependencies:
      - redis (consumer)
      - postgres
      - minio
      - qdrant
    interfaces:
      - type: Consumer
        source: redis_stream
        stream: chameleon:messages:processed
      - type: HTTP
        endpoints:
          - GET /dashboard/metrics
          - GET /dashboard/reports
          - POST /dashboard/export

  - id: shared
    name: "Shared Library"
    responsibility: "Общие модели, утилиты, gRPC стабы"
    language: "Python 3.11"
    exports:
      - shared_models/
      - shared_utils/
      - grpc_stubs/

data_flow:
  sync_flow:
    name: "Realtime Adaptation"
    path: "User → Chat UI → API Gateway → Orchestrator → Retriever → LLM → Response"
    latency_target_ms: 800
    protocol: "WebSocket + gRPC"

  async_flow:
    name: "Black Box Analytics"
    path: "Orchestrator → Redis Stream → Black Box → PostgreSQL/MinIO"
    latency_target_ms: 5000
    protocol: "Redis Streams"

  batch_flow:
    name: "RAGas Evaluation"
    path: "CI → RAGas Evaluator → Qdrant → LLM → Report → Dashboard"
    schedule: "daily"

deployment:
  local:
    orchestrator: "docker-compose up"
    requirements:
      - Docker 20.10+
      - Docker Compose 2.0+
      - 16GB RAM (8GB без GPU)
      - 50GB disk
  production_future:
    orchestrator: "Kubernetes (Helm)"
    requirements:
      - GPU nodes for Ollama
      - Persistent volumes
      - Load balancer