# spec/modules/chat-frontend.yml
schema: 1.0.0
type: module
id: module-2-chat-frontend
name: "Chat Frontend"

components:
  - id: websocket-server
    name: "WebSocket Server"
    responsibility: "Управление соединениями real-time"
    technology: "Node.js + ws library"
    internal_components:
      - ConnectionManager
      - MessageBroadcaster
      - HeartbeatMonitor

  - id: api-server
    name: "REST API Server"
    responsibility: "HTTP эндпоинты для чата"
    technology: "Express.js"
    internal_components:
      - UserService
      - RoomService
      - MessageService

  - id: grpc-client
    name: "gRPC Client"
    responsibility: "Вызов Orchestrator"
    technology: "@grpc/grpc-js"

  - id: react-ui
    name: "React UI"
    responsibility: "Пользовательский интерфейс"
    technology: "React 18 + Vite"
    components:
      - ChatWindow
      - MessageList
      - MessageInput
      - StyleSelector
      - UserList
      - AdaptationIndicator

apis:
  websocket:
    endpoint: /ws
    messages:
      - type: auth
        direction: client→server
        schema:
          user_id: string
          token: string
      - type: auth_ok
        direction: server→client
        schema:
          session_id: string
      - type: message
        direction: client→server
        schema:
          id: string
          to: string
          text: string
          style: string (optional)
      - type: message
        direction: server→client
        schema:
          id: string
          from: string
          text: string
          was_adapted: boolean
          original_text: string (optional)

  rest:
    base_path: /api/v1
    endpoints:
      - path: /users
        methods: [GET]
        response: UserList
      - path: /users/{id}
        methods: [GET]
        response: UserProfile
      - path: /rooms
        methods: [GET]
        response: RoomList
      - path: /rooms/{id}/messages
        methods: [GET]
        parameters:
          - limit: number (default 50)
          - before: string (cursor)
        response: MessageHistory
      - path: /styles
        methods: [GET]
        response: StyleList

dependencies:
  services:
    - module-1-core-engine (orchestrator)
  infrastructure:
    - redis (for sessions)

configuration:
  environment_variables:
    - PORT=8080
    - WS_PORT=8081
    - ORCHESTRATOR_URL=localhost:8001
    - REDIS_URL=redis://redis:6379
    - JWT_SECRET=development_secret
    - NODE_ENV=development

  ui:
    features:
      - style_selector: true
      - show_original_on_hover: true
      - typing_indicators: true
      - read_receipts: false
    themes:
      - light
      - dark