# spec/modules/analytics.yml
schema: 1.0.0
type: module
id: module-4-analytics
name: "Analytics & Dashboard"

components:
  - id: black-box
    name: "Black Box Analyzer"
    responsibility: "Асинхронный анализ оригиналов"
    technology: "Python + Redis consumer"
    internal_components:
      - StreamConsumer
      - StyleClassifier
      - ToxicityDetector
      - IntentClassifier
      - ImpactAnalyzer
      - ProfileUpdater
      - FewShotGenerator
      - StorageWriter

  - id: dashboard
    name: "Analytics Dashboard"
    responsibility: "Визуализация метрик"
    technology: "FastAPI + Plotly"
    internal_components:
      - MetricsAPI
      - ReportGenerator
      - ChartBuilder
      - ExportService

  - id: rag-evaluator
    name: "RAGas Evaluator"
    responsibility: "Автоматическая оценка RAG"
    technology: "Python + RAGas library"
    internal_components:
      - TestSetLoader
      - RetrieverSimulator
      - MetricCalculator
      - ReportRenderer

classifiers:
  toxicity:
    model: "rubert-tiny2"
    threshold:
      low: 0.3
      medium: 0.6
      high: 0.8
    output:
      - score: float
      - label: string
      - subcategories: map[string]float

  intent:
    model: "llama3.2:3b (local)"
    types:
      - blame_critical
      - request_action
      - negative_feedback
      - positive_feedback
      - question
      - joke
      - vent

  formality:
    scale: 1-10
    indicators:
      - ты_usage
      - imperative_mood
      - missing_patronymic
      - slang_usage

analytics_models:
  message_analytics:
    table: messages_analytics
    fields:
      - message_id: string (PK)
      - sender_id: string
      - recipient_id: string
      - original_text_hash: string
      - original_toxicity: float
      - original_intent: string
      - original_formality: integer
      - adaptation_effectiveness: float
      - conflict_probability_without: float
      - conflict_probability_with: float
      - model_used: string
      - processing_latency_ms: integer
      - was_adapted: boolean
      - created_at: timestamp

  daily_metrics:
    table: daily_metrics
    fields:
      - date: date (PK)
      - total_messages: integer
      - adaptations_count: integer
      - avg_toxicity_decrease: float
      - avg_formality_increase: float
      - avg_processing_latency_ms: float
      - avg_adaptation_effectiveness: float

dashboards:
  - name: system_health
    widgets:
      - service_status (table)
      - request_rate (line chart)
      - error_rate (gauge)
      - p95_latency (line chart)

  - name: adaptation_quality
    widgets:
      - adaptation_rate (pie)
      - toxicity_reduction (bar)
      - top_rules_used (bar)
      - model_distribution (donut)

  - name: user_insights
    widgets:
      - sentiment_trend (line)
      - top_triggers (bar)
      - conflict_hotspots (heatmap)
      - adaptation_effectiveness_by_role (grouped bar)

events:
  consumer:
    source: redis_stream
    stream_name: chameleon:messages:processed
    consumer_group: blackbox_group
    batch_size: 10
    poll_interval_ms: 100

  output:
    postgres:
      table: messages_analytics
      batch_size: 100
      flush_interval_sec: 5
    minio:
      bucket: chameleon-raw-messages
      path_template: "raw/{date}/{message_id}.json"

configuration:
  environment_variables:
    - BLACK_BOX_PORT=8004
    - DASHBOARD_PORT=8200
    - REDIS_URL=redis://redis:6379
    - STREAM_NAME=chameleon:messages:processed
    - DATABASE_URL=postgresql://chameleon:chameleon123@postgres:5432/chameleon_analytics
    - MINIO_ENDPOINT=minio:9000
    - MINIO_ACCESS_KEY=minioadmin
    - MINIO_SECRET_KEY=minioadmin123
    - QDRANT_URL=qdrant:6334
    - OLLAMA_URL=http://ollama:11434

  schedule:
    rag_evaluation: "0 2 * * *"  # nightly at 2 AM
    metrics_aggregation: "0 * * * *"  # hourly
    report_generation: "0 8 * * 1"  # weekly on Monday 8 AM