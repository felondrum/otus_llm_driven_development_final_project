# spec/modules/admin-data.yml
schema: 1.0.0
type: module
id: module-3-admin-data
name: "Admin & Data Management"

components:
  - id: admin-api
    name: "Admin REST API"
    responsibility: "Управление данными"
    technology: "Python/FastAPI"
    internal_components:
      - DocumentService
      - ProfileService
      - RuleService
      - SystemService

  - id: data-loader
    name: "Data Loader"
    responsibility: "Загрузка документов в RAG"
    technology: "Python CLI + Qdrant client"
    internal_components:
      - FileProcessor
      - Chunker
      - Embedder
      - QdrantIngestor

  - id: admin-ui
    name: "Admin UI"
    responsibility: "Веб-интерфейс администратора"
    technology: "React + React-Admin"
    pages:
      - Dashboard (system status)
      - Documents (upload, list, delete)
      - Profiles (import, edit)
      - Rules (visual editor)
      - Styles (book upload)
      - System (cache clear, reload)

apis:
  admin_rest:
    base_path: /api/v1/admin
    authentication: X-API-Key header
    endpoints:
      # Documents
      - path: /documents/upload
        method: POST
        content_type: multipart/form-data
        parameters:
          - file: binary (required)
          - collection: enum[corporate_rules, artistic_styles]
          - metadata: json (optional)
        response: JobStatus

      - path: /documents
        method: GET
        parameters:
          - collection: string
          - limit: number (default 50)
          - offset: number
        response: DocumentList

      - path: /documents/{id}
        method: DELETE
        response: DeleteResult

      # Profiles
      - path: /profiles/import
        method: POST
        content_type: multipart/form-data
        parameters:
          - file: binary (CSV/JSON)
          - format: enum[csv, json]
        response: ImportResult

      - path: /profiles
        method: GET
        parameters:
          - role: string (optional)
          - department: string (optional)
          - limit: number
        response: ProfileList

      - path: /profiles/{user_id}
        method: PUT
        request: UserProfile
        response: UpdateResult

      # System
      - path: /system/status
        method: GET
        response: SystemStatus

      - path: /system/cache/clear
        method: POST
        parameters:
          - pattern: string (optional)
        response: CacheClearResult

      - path: /system/rules/reload
        method: POST
        response: ReloadResult

data_models:
  document:
    id: string (UUID)
    file_name: string
    collection: string
    chunk_count: integer
    uploaded_at: datetime
    uploaded_by: string
    metadata: map[string]any

  job_status:
    job_id: string
    status: enum[pending, processing, completed, failed]
    documents_expected: integer
    documents_ingested: integer
    failed_chunks: integer
    completed_at: datetime (optional)
    error_log: string (optional)

configuration:
  environment_variables:
    - ADMIN_API_PORT=8100
    - ADMIN_API_KEY=chameleon_admin_123
    - QDRANT_URL=qdrant:6334
    - DATABASE_URL=postgresql://chameleon:chameleon123@postgres:5432/chameleon
    - OLLAMA_URL=http://ollama:11434
    - UPLOAD_DIR=/uploads

  chunking:
    strategy: recursive
    chunk_size: 512
    overlap: 50
    separators: ["\n\n", "\n", ".", " ", ""]