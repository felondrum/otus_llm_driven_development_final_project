# ===========================================
# Docker Compose for Module 3 (Admin Data)
# ===========================================

services:
  postgres:
    image: postgres:15
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=chameleon_admin
      - POSTGRES_USER=chameleon
      - POSTGRES_PASSWORD=chameleon123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - chameleon-network

  admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8200:8100"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ADMIN_PORT=8100
      - MODULE2_HOST=host.docker.internal
      - MODULE2_PORT=8080
      - CORE_ENGINE_HTTP_HOST=host.docker.internal
      - CORE_ENGINE_HTTP_PORT=8001
      - RETRIEVER_HTTP_HOST=host.docker.internal
      - RETRIEVER_HTTP_PORT=8002
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
      - DATABASE_URL=postgresql://chameleon:chameleon123@host.docker.internal:5433/chameleon_admin
    networks:
      - chameleon-network

networks:
  chameleon-network:
    external: true
