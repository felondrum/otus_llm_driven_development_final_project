# ===========================================
# Docker Compose для модуля 2 - Chat Frontend
# ===========================================
# Один контейнер чата с Redis Pub/Sub для расширяемости

services:
  # Первый чат
  chat-1:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_WS_PORT=8080
    container_name: chameleon-chat-1
    ports:
      - "8080:8080"  # HTTP and WebSocket
    environment:
      - CHAT_INSTANCE=1
      - ORCHESTRATOR_HOST=host.docker.internal
      - ORCHESTRATOR_PORT=8001
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis123
      - PORT=8080
      - WS_PORT=8080
    volumes:
      - ./src/backend:/app/backend
      - ./config:/app/config
    networks:
      - chameleon-network

networks:
  chameleon-network:
    driver: bridge
