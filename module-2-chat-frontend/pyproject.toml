[tool.poetry]
name = "chameleon-chat-frontend"
version = "1.0.0"
description = "Chat Frontend for Chameleon AI"
authors = ["Chameleon Team"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.1"}
websockets = "^12.0"
grpcio = "^1.60.0"
grpcio-tools = "1.60.0"
protobuf = "4.25.9"
httpx = "^0.26.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
protobuf = "4.25.9"
grpcio-tools = "1.60.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
